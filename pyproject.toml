[project]
name = "beyondagents"
version = "0.1.0"
description = "Beyond the PoC: the production challenges of AI agents, measured."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    "mcp==2.3.0",
    "utcp==1.2.0",
    "utcp-http>=1.1.15",
    "pyjwt[crypto]>=2.9",
    "utcp-cli>=1.1.5",
    "mem0ai==2.2.1",
    "ollama>=0.6.3",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "dbos>=3.6.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
